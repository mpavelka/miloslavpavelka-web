<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network access: only inline code runs, and nothing can be fetched or sent except this site's favicon. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="author" content="Miloslav Pavelka">
<meta name="description" content="Generate a QR code for a TOTP secret entirely in your browser. Nothing you type is sent anywhere.">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
<title>TOTP QR Generator</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --border: #d9d9d4; --accent: #22646B; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --card: #20201f; --border: #3a3a37; --accent: #6fbfc7; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  .home { display: inline-block; margin-bottom: 20px; text-decoration: none; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
  input { width: 100%; padding: 9px 10px; font: 14px ui-monospace, Menlo, monospace; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .out { margin-top: 24px; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; text-align: center; }
  canvas { max-width: 100%; height: auto; image-rendering: pixelated; }
  .uri { margin-top: 12px; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); word-break: break-all; text-align: left; }
  .code { margin-top: 12px; font: 600 26px ui-monospace, Menlo, monospace; letter-spacing: 0.15em; }
  .err { color: var(--err); font-size: 13px; }
  a { color: var(--accent); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="home" href="/">&larr; miloslavpavelka.com</a>
  <h1>TOTP QR Generator</h1>
  <p class="sub">The QR code is generated in your browser. Nothing you type leaves this page: a Content-Security-Policy blocks all network requests.</p>
  <noscript><p class="err">This page needs JavaScript to generate the QR code.</p></noscript>

  <label for="secret">Secret</label>
  <input id="secret" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="JBSWY3DPEHPK3PXP">
  <div class="hint">Base32 secret, or paste a full <code>otpauth://</code> URI.</div>

  <label for="account">Account</label>
  <input id="account" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="admin@example.com">

  <label for="issuer">Issuer</label>
  <input id="issuer" autocomplete="off" spellcheck="false" placeholder="Example">

  <div class="out" id="out" hidden>
    <canvas id="qr"></canvas>
    <div class="code" id="code" title="Current code — compare with your authenticator app"></div>
    <div class="uri" id="uri"></div>
    <div style="margin-top:10px"><a id="dl" download="totp-qr.png" href="#">Download PNG</a></div>
  </div>
  <div class="err" id="err"></div>
</main>

<script>
"use strict";

// ---- QR encoder (byte mode, error correction level M, versions 1-40) ----

const ECC_PER_BLOCK = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
const NUM_BLOCKS    = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];

function rawDataModules(ver) {
  let r = (16 * ver + 128) * ver + 64;
  if (ver >= 2) {
    const na = Math.floor(ver / 7) + 2;
    r -= (25 * na - 10) * na - 55;
    if (ver >= 7) r -= 36;
  }
  return r;
}
const dataCodewords = ver => Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];

function gfMul(x, y) {
  let z = 0;
  for (let i = 7; i >= 0; i--) {
    z = (z << 1) ^ ((z >>> 7) * 0x11D);
    z ^= ((y >>> i) & 1) * x;
  }
  return z & 0xFF;
}
function rsDivisor(deg) {
  const r = new Array(deg).fill(0);
  r[deg - 1] = 1;
  let root = 1;
  for (let i = 0; i < deg; i++) {
    for (let j = 0; j < deg; j++) {
      r[j] = gfMul(r[j], root);
      if (j + 1 < deg) r[j] ^= r[j + 1];
    }
    root = gfMul(root, 0x02);
  }
  return r;
}
function rsRemainder(data, div) {
  const r = div.map(() => 0);
  for (const b of data) {
    const f = b ^ r.shift();
    r.push(0);
    div.forEach((c, i) => { r[i] ^= gfMul(c, f); });
  }
  return r;
}
function alignmentPositions(ver) {
  if (ver === 1) return [];
  const num = Math.floor(ver / 7) + 2;
  const step = Math.floor((ver * 8 + num * 3 + 5) / (num * 4 - 4)) * 2;
  const r = [6];
  for (let pos = ver * 4 + 10; r.length < num; pos -= step) r.splice(1, 0, pos);
  return r;
}
const bit = (x, i) => ((x >>> i) & 1) !== 0;

const MASKS = [
  (x, y) => (x + y) % 2 === 0,
  (x, y) => y % 2 === 0,
  (x, y) => x % 3 === 0,
  (x, y) => (x + y) % 3 === 0,
  (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
  (x, y) => x * y % 2 + x * y % 3 === 0,
  (x, y) => (x * y % 2 + x * y % 3) % 2 === 0,
  (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0,
];

function encodeQR(text) {
  const bytes = new TextEncoder().encode(text);
  let ver = 1;
  for (;; ver++) {
    if (ver > 40) throw new Error("Text too long for a QR code");
    if (4 + (ver <= 9 ? 8 : 16) + bytes.length * 8 <= dataCodewords(ver) * 8) break;
  }

  // Data bits: mode, length, payload, terminator, padding.
  const bits = [];
  const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  push(0x4, 4);
  push(bytes.length, ver <= 9 ? 8 : 16);
  bytes.forEach(b => push(b, 8));
  const cap = dataCodewords(ver) * 8;
  push(0, Math.min(4, cap - bits.length));
  push(0, (8 - bits.length % 8) % 8);
  for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) push(p, 8);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0;
    for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    data.push(b);
  }

  // Split into blocks, add Reed-Solomon ECC, interleave.
  const numBlocks = NUM_BLOCKS[ver], eccLen = ECC_PER_BLOCK[ver];
  const rawCw = Math.floor(rawDataModules(ver) / 8);
  const numShort = numBlocks - rawCw % numBlocks;
  const shortLen = Math.floor(rawCw / numBlocks);
  const div = rsDivisor(eccLen);
  const blocks = [];
  for (let i = 0, k = 0; i < numBlocks; i++) {
    const dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
    k += dat.length;
    const ecc = rsRemainder(dat, div);
    if (i < numShort) dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  const codewords = [];
  for (let i = 0; i < blocks[0].length; i++) {
    blocks.forEach((b, j) => {
      if (i !== shortLen - eccLen || j >= numShort) codewords.push(b[i]);
    });
  }

  // Module matrix.
  const size = ver * 4 + 17;
  const mod = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const set = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };

  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
      if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  const ap = alignmentPositions(ver), na = ap.length;
  for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
    if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
      set(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }
  const drawFormat = mask => {
    const d = (0 << 3) | mask; // ECC level M = 0b00
    let rem = d;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const b = ((d << 10) | rem) ^ 0x5412;
    for (let i = 0; i <= 5; i++) set(8, i, bit(b, i));
    set(8, 7, bit(b, 6)); set(8, 8, bit(b, 7)); set(7, 8, bit(b, 8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bit(b, i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(b, i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(b, i));
    set(8, size - 8, true);
  };
  drawFormat(0);
  if (ver >= 7) {
    let rem = ver;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
    const b = (ver << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const a = size - 11 + i % 3, c = Math.floor(i / 3);
      set(a, c, bit(b, i)); set(c, a, bit(b, i));
    }
  }

  // Place codewords in the zigzag pattern.
  let n = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
      const x = right - j;
      const y = ((right + 1) & 2) === 0 ? size - 1 - v : v;
      if (!fn[y][x] && n < codewords.length * 8) {
        mod[y][x] = bit(codewords[n >>> 3], 7 - (n & 7));
        n++;
      }
    }
  }

  const applyMask = m => {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
      if (!fn[y][x] && MASKS[m](x, y)) mod[y][x] = !mod[y][x];
  };
  const penalty = () => {
    let p = 0, dark = 0;
    const lines = [];
    for (let i = 0; i < size; i++) {
      lines.push(mod[i]);
      lines.push(mod.map(row => row[i]));
    }
    for (const line of lines) {
      let run = 1;
      for (let k = 1; k <= size; k++) {
        if (k < size && line[k] === line[k - 1]) run++;
        else { if (run >= 5) p += run - 2; run = 1; }
      }
      const s = "0000" + line.map(v => v ? "1" : "0").join("") + "0000";
      for (const pat of ["10111010000", "00001011101"])
        for (let k = s.indexOf(pat); k !== -1; k = s.indexOf(pat, k + 1)) p += 40;
    }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (mod[y][x]) dark++;
      if (x < size - 1 && y < size - 1) {
        const c = mod[y][x];
        if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
      }
    }
    const total = size * size;
    p += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
    return p;
  };

  let best = 0, bestP = Infinity;
  for (let m = 0; m < 8; m++) {
    applyMask(m); drawFormat(m);
    const p = penalty();
    if (p < bestP) { best = m; bestP = p; }
    applyMask(m);
  }
  applyMask(best); drawFormat(best);
  return mod;
}

function drawQR(canvas, mod) {
  const quiet = 4, scale = 8, size = mod.length;
  const px = (size + quiet * 2) * scale;
  canvas.width = canvas.height = px;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = "#000";
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
    if (mod[y][x]) ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
}

// ---- TOTP ----

function base32Decode(s) {
  const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let bits = 0, val = 0;
  const out = [];
  for (const ch of s) {
    const i = alpha.indexOf(ch);
    if (i < 0) throw new Error("Secret is not valid Base32 (A-Z, 2-7)");
    val = (val << 5) | i; bits += 5;
    if (bits >= 8) { out.push((val >>> (bits - 8)) & 0xFF); bits -= 8; }
  }
  return new Uint8Array(out);
}

async function totp(secretBytes, { digits = 6, period = 30, algorithm = "SHA1" } = {}) {
  const hash = { SHA1: "SHA-1", SHA256: "SHA-256", SHA512: "SHA-512" }[algorithm];
  if (!hash || !crypto.subtle || !secretBytes.length) return null;
  const counter = Math.floor(Date.now() / 1000 / period);
  const msg = new Uint8Array(8);
  new DataView(msg.buffer).setUint32(4, counter);
  new DataView(msg.buffer).setUint32(0, Math.floor(counter / 2 ** 32));
  const key = await crypto.subtle.importKey("raw", secretBytes, { name: "HMAC", hash }, false, ["sign"]);
  const h = new Uint8Array(await crypto.subtle.sign("HMAC", key, msg));
  const o = h[h.length - 1] & 0xF;
  const bin = ((h[o] & 0x7F) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3];
  return String(bin % 10 ** digits).padStart(digits, "0");
}

// ---- UI ----

const $ = id => document.getElementById(id);
let current = null;

function buildUri() {
  const raw = $("secret").value.trim();
  if (!raw) return null;
  if (/^otpauth:\/\//i.test(raw)) {
    const u = new URL(raw);
    const p = u.searchParams;
    return {
      uri: raw,
      secret: (p.get("secret") || "").replace(/[\s=]/g, "").toUpperCase(),
      opts: {
        digits: +(p.get("digits") || 6),
        period: +(p.get("period") || 30),
        algorithm: (p.get("algorithm") || "SHA1").toUpperCase(),
      },
    };
  }
  const secret = raw.replace(/[\s=-]/g, "").toUpperCase();
  const account = $("account").value.trim();
  const issuer = $("issuer").value.trim();
  const label = issuer && account ? encodeURIComponent(issuer) + ":" + encodeURIComponent(account)
              : encodeURIComponent(account || issuer || "TOTP");
  let uri = "otpauth://totp/" + label + "?secret=" + secret;
  if (issuer) uri += "&issuer=" + encodeURIComponent(issuer);
  return { uri, secret, opts: {} };
}

function render() {
  $("err").textContent = "";
  try {
    current = buildUri();
    if (!current) { $("out").hidden = true; return; }
    current.key = base32Decode(current.secret);
    const canvas = $("qr");
    drawQR(canvas, encodeQR(current.uri));
    canvas.style.width = Math.min(canvas.width, 320) + "px";
    $("uri").textContent = current.uri;
    $("dl").href = canvas.toDataURL("image/png");
    $("out").hidden = false;
    tick();
  } catch (e) {
    current = null;
    $("out").hidden = true;
    $("err").textContent = e.message;
  }
}

async function tick() {
  if (!current) return;
  const c = current;
  const code = await totp(c.key, c.opts).catch(() => null);
  if (c === current) $("code").textContent = code ? code.replace(/(\d{3})(?=\d)/, "$1 ") : "";
}

["secret", "account", "issuer"].forEach(id => $(id).addEventListener("input", render));
setInterval(tick, 1000);
</script>
</body>
</html>
